const LanguageContext = createContext({ lang: "en", setLang: () => {}, t: (k) => k });
function useLang() { return useContext(LanguageContext); }
function makeT(lang) {
  return (key) => TRANSLATIONS[lang]?.[key] ?? TRANSLATIONS.en[key] ?? key;
}

function topReturnReason(reasons) {
  if (!reasons) return null;
  const entries = Object.entries(reasons).filter(([, v]) => v > 0);
  if (entries.length === 0) return null;
  entries.sort((a, b) => b[1] - a[1]);
  return { key: entries[0][0], count: entries[0][1] };
}
function totalReturns(returnsObj) {
  if (!returnsObj) return 0;
  return Object.values(returnsObj).reduce((s, p) => s + (p.total || 0), 0);
}
function priceSpread(prices) {
  const vals = Object.values(prices || {}).map(Number).filter((v) => !isNaN(v));
  if (vals.length < 2) return 0;
  return Math.max(...vals) - Math.min(...vals);
}

// ---------- Helpers ----------
async function callClaude(prompt) {
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 1000, messages: [{ role: "user", content: prompt }] }),
  });
  const data = await response.json();
  if (!response.ok) {
    const msg = data?.error?.message || data?.error?.type || `HTTP ${response.status}`;
    throw new Error(`API error: ${msg}`);
  }
  const text = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n");
  if (!text) throw new Error("Empty response from model");
  return text;
}
// Parses output delimited by ===KEY=== markers — avoids JSON entirely so quotes,
// apostrophes, and line breaks inside the model's text can never break parsing.
function parseMarkedSections(text, keys) {
  const result = {};
  for (const key of keys) {
    const marker = `===${key.toUpperCase()}===`;
    const startIdx = text.indexOf(marker);
    if (startIdx === -1) continue;
    const afterStart = startIdx + marker.length;
    let endIdx = text.length;
    for (const other of keys) {
      if (other === key) continue;
      const otherMarker = `===${other.toUpperCase()}===`;
      const otherIdx = text.indexOf(otherMarker, afterStart);
      if (otherIdx !== -1 && otherIdx < endIdx) endIdx = otherIdx;
    }
    result[key] = text.slice(afterStart, endIdx).trim();
  }
  const missing = keys.filter((k) => !result[k]);
  if (missing.length) throw new Error(`Missing sections in model response: ${missing.join(", ")}`);
  return result;
}
// Parses pipe-delimited lines "level|title|reason" — robust against quotes/newlines.
function parsePipedLines(text) {
  const lines = text.split("\n").map((l) => l.trim()).filter(Boolean);
  const rows = [];
  for (const line of lines) {
    const parts = line.split("|").map((p) => p.trim());
    if (parts.length < 3) continue;
    const [level, title, ...rest] = parts;
    rows.push({ level: level.toLowerCase(), title, reason: rest.join(" | ") });
  }
  if (rows.length === 0) throw new Error("Could not find any valid recommendation lines in model response");
  return rows;
}
function sortOrders(orders) {
  return orders.slice().sort((a, b) => {
    const ta = new Date(a.timestamp).getTime();
    const tb = new Date(b.timestamp).getTime();
    if (ta !== tb) return ta - tb;
    return platformName(a.platform).localeCompare(platformName(b.platform));
  });
}
function formatTs(ts) {
  const d = new Date(ts);
  return d.toLocaleString("en-MY", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}

// Card that tilts in 3D toward the cursor on hover, with a soft glare highlight —
// only used on purely informational cards (no nested buttons), so tilting never
// interferes with clicking something inside.
function TiltCard({ children, className, style, maxTilt = 7 }) {
  const ref = useRef(null);
  const [transform, setTransform] = useState("perspective(700px) rotateX(0deg) rotateY(0deg) scale(1)");
  const [glare, setGlare] = useState({ x: 50, y: 50, opacity: 0 });

  function handleMouseMove(e) {
    const el = ref.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    const px = (e.clientX - rect.left) / rect.width;
    const py = (e.clientY - rect.top) / rect.height;
    const rotateY = (px - 0.5) * maxTilt * 2;
    const rotateX = (0.5 - py) * maxTilt * 2;
    setTransform(`perspective(700px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.015)`);
    setGlare({ x: px * 100, y: py * 100, opacity: 0.1 });
  }
  function handleMouseLeave() {
    setTransform("perspective(700px) rotateX(0deg) rotateY(0deg) scale(1)");
    setGlare((g) => ({ ...g, opacity: 0 }));
  }

  return (
    <div
      ref={ref}
      onMouseMove={handleMouseMove}
      onMouseLeave={handleMouseLeave}
      className={className}
      style={{ ...style, position: "relative", overflow: "hidden", transform, transition: "transform 150ms ease-out", willChange: "transform" }}
    >
      {children}
      <div
        className="pointer-events-none absolute inset-0"
        style={{ background: `radial-gradient(circle at ${glare.x}% ${glare.y}%, rgba(255,255,255,${glare.opacity}), transparent 60%)`, transition: "opacity 200ms ease" }}
      />
    </div>
  );
}

// Staggered fade-up entrance for a list of items — pure CSS, no dependency.
function AnimatedList({ children, className, itemClassName, staggerMs = 60 }) {
  const items = React.Children.toArray(children);
  return (
    <div className={className}>
      {items.map((child, i) => (
        <div key={child.key ?? i} className={itemClassName} style={{ animation: "oneniagaFadeUp 320ms ease-out both", animationDelay: `${i * staggerMs}ms` }}>
          {child}
        </div>
      ))}
    </div>
  );
}

function StockTooltip({ active, payload, t }) {
  if (!active || !payload || !payload.length) return null;
  const d = payload[0].payload;
  return (

function pad2(n) { return String(n).padStart(2, "0"); }
function ymd(y, m, d) { return `${y}-${pad2(m + 1)}-${pad2(d)}`; }

function OrderDatePicker({ orders, value, onChange, t }) {
  const [open, setOpen] = useState(false);
  const today = new Date();
  const base = value ? new Date(value + "T00:00:00") : today;
  const [viewYear, setViewYear] = useState(base.getFullYear());
  const [viewMonth, setViewMonth] = useState(base.getMonth());

  const orderDateSet = new Set(orders.map((o) => o.timestamp.slice(0, 10)));

  const firstOfMonth = new Date(viewYear, viewMonth, 1);
  const startWeekday = firstOfMonth.getDay();
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();

  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push({ day: daysInPrevMonth - startWeekday + 1 + i, current: false });
  for (let d = 1; d <= daysInMonth; d++) cells.push({ day: d, current: true });
  while (cells.length % 7 !== 0) cells.push({ day: cells.length - startWeekday - daysInMonth + 1, current: false });

  function prevMonth() { if (viewMonth === 0) { setViewMonth(11); setViewYear(viewYear - 1); } else setViewMonth(viewMonth - 1); }
  function nextMonth() { if (viewMonth === 11) { setViewMonth(0); setViewYear(viewYear + 1); } else setViewMonth(viewMonth + 1); }

  const monthLabel = firstOfMonth.toLocaleString("en-US", { month: "long", year: "numeric" });
  const weekdayLabels = ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"];
  const todayStr = ymd(today.getFullYear(), today.getMonth(), today.getDate());
  const displayLabel = value ? new Date(value + "T00:00:00").toLocaleDateString("en-MY", { month: "short", day: "numeric", year: "numeric" }) : t("orders.pickDate");

  return (
    <div className="relative">
      <button onClick={() => setOpen(!open)} className="flex items-center gap-2 rounded-lg px-3 py-1.5 text-[12px]" style={{ border: `1px solid ${BORDER}`, background: "white", color: value ? INK : MUTED }}>
        <CalendarDays size={14} style={{ color: MUTED }} />
        {displayLabel}
      </button>
      {open && (
        <>
          <div className="fixed inset-0 z-10" onClick={() => setOpen(false)} />
          <div className="absolute right-0 z-20 mt-2 rounded-xl p-3" style={{ background: "white", border: `1px solid ${BORDER}`, boxShadow: "0 10px 28px rgba(0,0,0,0.14)", width: 268, maxWidth: "90vw" }}>
            <div className="flex items-center justify-between mb-2 px-0.5">
              <button onClick={prevMonth} className="p-1 rounded-md" style={{ color: MUTED }}><ChevronLeft size={15} /></button>
              <span className="text-[12.5px] font-semibold" style={{ color: NAVY }}>{monthLabel}</span>
              <button onClick={nextMonth} className="p-1 rounded-md" style={{ color: MUTED }}><ChevronRight size={15} /></button>
            </div>
            <div className="grid grid-cols-7 mb-1">
              {weekdayLabels.map((w) => <div key={w} className="text-[10px] text-center font-medium" style={{ color: "#9A927E" }}>{w}</div>)}
            </div>
            <div className="grid grid-cols-7 gap-0.5">
              {cells.map((c, i) => {
                const ds = c.current ? ymd(viewYear, viewMonth, c.day) : null;
                const hasOrders = ds && orderDateSet.has(ds);
                const isSelected = ds && ds === value;
                const isToday = ds && ds === todayStr;
                return (
                  <button
                    key={i}
                    disabled={!c.current}
                    onClick={() => { onChange(ds); setOpen(false); }}
                    className="relative h-8 rounded-md text-[11.5px] flex items-center justify-center"
                    style={{
                      color: !c.current ? "#D8D4CB" : isSelected ? "white" : INK,
                      background: isSelected ? NAVY : isToday ? CREAM : "transparent",
                      fontWeight: isToday || isSelected ? 700 : 400,
                      cursor: c.current ? "pointer" : "default",
                    }}
                  >
                    {c.day}
                    {hasOrders && (
                      <span
                        className="absolute bottom-1 w-1.5 h-1.5 rounded-full"
                        style={{ background: isSelected ? "#8FD9B6" : CORAL }}
                      />
                    )}
                  </button>
                );
              })}
            </div>
            <div className="flex items-center justify-between mt-2.5 pt-2.5" style={{ borderTop: `1px solid ${BORDER}` }}>
              <button onClick={() => { onChange(""); setOpen(false); }} className="text-[11.5px] font-semibold" style={{ color: MUTED }}>{t("orders.clearDate")}</button>
              <span className="flex items-center gap-1 text-[10px]" style={{ color: "#9A927E" }}><span className="w-1.5 h-1.5 rounded-full" style={{ background: CORAL }} /> {t("orders.hasOrders")}</span>
              <button onClick={() => { onChange(todayStr); setViewYear(today.getFullYear()); setViewMonth(today.getMonth()); setOpen(false); }} className="text-[11.5px] font-semibold" style={{ color: CORAL }}>{t("orders.today")}</button>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

function sortOrdersBy(orders, key, dir) {
  const sorted = orders.slice().sort((a, b) => {
    let cmp = 0;
    if (key === "timestamp") {
      cmp = new Date(a.timestamp).getTime() - new Date(b.timestamp).getTime();
      if (cmp === 0) cmp = platformName(a.platform).localeCompare(platformName(b.platform));
    } else if (key === "amount") {
      cmp = a.amount - b.amount;
    } else if (key === "status") {
      cmp = a.status.localeCompare(b.status);
    } else if (key === "platform") {
      cmp = platformName(a.platform).localeCompare(platformName(b.platform));
    } else if (key === "orderNo") {
      cmp = a.orderNo.localeCompare(b.orderNo, undefined, { numeric: true });
    } else if (key === "customer") {
      cmp = a.customer.localeCompare(b.customer);
    } else if (key === "product") {
      cmp = a.product.localeCompare(b.product);
    }
    return dir === "asc" ? cmp : -cmp;
  });
  return sorted;
}

function SortHeader({ label, sortKey, activeKey, dir, onClick }) {

      <span className="truncate">{label}</span>
      {active ? (dir === "asc" ? <ChevronUp size={12} className="shrink-0" /> : <ChevronDown size={12} className="shrink-0" />) : <ChevronsUpDown size={11} className="shrink-0" style={{ opacity: 0.4 }} />}
    </button>
  );
}

function CategoryFilter({ label, options, selected, onChange, t }) {
  const [open, setOpen] = useState(false);
  const allSelected = selected.size === options.length;
  function toggle(id) {
    const next = new Set(selected);
    if (next.has(id)) next.delete(id); else next.add(id);
    onChange(next);
  }
  const displayLabel = allSelected ? label : `${label} (${selected.size})`;
  return (
    <div className="relative">
      <button
        onClick={() => setOpen(!open)}
        className="flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-[12px] font-medium"
        style={{ border: `1px solid ${allSelected ? BORDER : CORAL}`, background: allSelected ? "white" : "#FBE4DB", color: allSelected ? INK : CORAL }}
      >
        {displayLabel} <ChevronDown size={12} />
      </button>
      {open && (
        <>
          <div className="fixed inset-0 z-10" onClick={() => setOpen(false)} />
          <div className="absolute left-0 z-20 mt-2 rounded-xl p-3" style={{ background: "white", border: `1px solid ${BORDER}`, boxShadow: "0 10px 28px rgba(0,0,0,0.14)", width: 210, maxWidth: "90vw" }}>
            <div className="space-y-1 max-h-56 overflow-y-auto">
              {options.map((opt) => (
                <label key={opt.id} className="flex items-center gap-2 text-[12.5px] py-1 cursor-pointer">
                  <input type="checkbox" checked={selected.has(opt.id)} onChange={() => toggle(opt.id)} style={{ accentColor: CORAL }} />
                  {opt.color && <span className="w-1.5 h-1.5 rounded-full shrink-0" style={{ background: opt.color }} />}
                  <span style={{ color: INK }}>{opt.label}</span>
                </label>
              ))}
            </div>
            <div className="flex items-center justify-between mt-2 pt-2" style={{ borderTop: `1px solid ${BORDER}` }}>
              <button onClick={() => onChange(new Set(options.map((o) => o.id)))} className="text-[11px] font-semibold" style={{ color: NAVY }}>{t("orders.selectAll")}</button>
              <button onClick={() => onChange(new Set())} className="text-[11px] font-semibold" style={{ color: MUTED }}>{t("orders.clearSelection")}</button>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

                        <p className="text-[12px]" style={{ color: p.descriptions?.[pl.id] ? INK : "#B0AA9C" }}>{p.descriptions?.[pl.id] || t("products.notGenerated")}</p>
                      </div>
                    ))}
                  </div>

                  <button onClick={() => onEdit(p.id)} className="flex items-center gap-1.5 text-[12px] font-semibold px-3 py-1.5 rounded-lg text-white" style={{ background: NAVY }}>
                    <Wand2 size={12} /> {genCount > 0 ? t("products.regenerate") : t("products.generate")}
                  </button>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function ImageUpload({ value, onChange }) {
  const { t } = useLang();
  const inputRef = useRef(null);
  function handleFile(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => onChange(reader.result);
    reader.readAsDataURL(file);
  }
  return (
    <div>
      <label className="text-[12px] font-medium block mb-1" style={{ color: MUTED }}>{t("automate.photo")}</label>
      <button type="button" onClick={() => inputRef.current?.click()} className="w-full h-28 rounded-lg flex flex-col items-center justify-center gap-1" style={{ border: `1px dashed ${BORDER}`, background: CREAM }}>
        {value ? <img src={value} alt="Product" className="h-full rounded-lg object-cover" /> : (<><Camera size={18} style={{ color: "#B7AF9E" }} /><span className="text-[11px]" style={{ color: "#9A927E" }}>{t("automate.uploadHint")}</span></>)}
      </button>
      <input ref={inputRef} type="file" accept="image/*" className="hidden" onChange={handleFile} />
    </div>
  );
}

function Automate({ products, setProducts, selectedId, setSelectedId }) {
  const { t } = useLang();
  const isNew = selectedId === null;
  const selected = products.find((p) => p.id === selectedId);
  const [form, setForm] = useState(selected ? { name: selected.name, category: selected.category, features: selected.features, price: selected.price, image: selected.image } : { name: "", category: "", features: "", price: "", image: null });
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [result, setResult] = useState(selected?.descriptions || null);
  const [publishing, setPublishing] = useState(null);
  const [contentLang, setContentLang] = useState("en");

  function selectProduct(id) {
    setSelectedId(id);
    if (id === null) { setForm({ name: "", category: "", features: "", price: "", image: null }); setResult(null); }
    else { const p = products.find((pp) => pp.id === id); setForm({ name: p.name, category: p.category, features: p.features, price: p.price, image: p.image }); setResult(p.descriptions || null); }
  }

  const canGenerate = form.name.trim() && form.features.trim();
  const currentProductId = isNew ? null : selectedId;

  async function generate() {
    setLoading(true); setError("");
    const languageLabel = CONTENT_LANGUAGES.find((l) => l.id === contentLang)?.label || "English";
    const prompt = `You are OneNiaga's AI listing assistant for a Malaysian multi-platform e-commerce seller.
Product name: ${form.name}
Category: ${form.category || "general"}
Key features / materials: ${form.features}
Price: RM ${form.price || "N/A"}
Write the descriptions in ${languageLabel}.

Write three product listing descriptions for the SAME product, matched to platform norms:
- Shopee: concise, bullet-friendly, price/promo-driven, 40-70 words
- Lazada: trust-focused, detailed specs, reassuring tone, 60-90 words
- TikTok Shop: casual, trend-driven, short punchy hooks, light emoji use, 30-50 words

All three must describe the exact same product consistently (same claims, same specs).

Respond in EXACTLY this format, nothing before or after, no markdown, no JSON:

===SHOPEE===
<shopee description here>
===LAZADA===
<lazada description here>
===TIKTOK===
<tiktok description here>`;
    try {
      const text = await callClaude(prompt);
      const json = parseMarkedSections(text, ["shopee", "lazada", "tiktok"]);
      setResult(json);
      if (isNew) {
        const price = parseFloat(form.price) || 0;
        const newProduct = {
          id: Date.now(), name: form.name, sku: "NEW-" + Math.floor(Math.random() * 900 + 100),
          category: form.category, features: form.features, price: form.price, stock: 20, dailySales: 1.0,
          image: form.image, descriptions: json,
          platformPrices: { shopee: price, lazada: price, tiktok: price },
          published: { shopee: false, lazada: false, tiktok: false },
          salesByPlatform: { shopee: { units: 0, revenue: 0 }, lazada: { units: 0, revenue: 0 }, tiktok: { units: 0, revenue: 0 } },
          returns: { shopee: { total: 0, reasons: {} }, lazada: { total: 0, reasons: {} }, tiktok: { total: 0, reasons: {} } },
        };
        setProducts((prev) => [...prev, newProduct]);
        setSelectedId(newProduct.id);
      } else {
        setProducts((prev) => prev.map((p) => (p.id === selectedId ? { ...p, ...form, descriptions: json } : p)));
      }
    } catch (e) {
      setError(`${t("automate.error")} (${e.message})`);
    } finally {
      setLoading(false);
    }
  }

  function publish(platformId) {
    if (!currentProductId) return;
    setPublishing(platformId);
    setTimeout(() => {
      setProducts((prev) => prev.map((p) => p.id === currentProductId ? { ...p, published: { ...p.published, [platformId]: true } } : p));
      setPublishing(null);
    }, 800);
  }

  const livePublished = products.find((p) => p.id === currentProductId)?.published;

  return (
    <div>
      <PageHeader eyebrow={t("nav.automate")} title={t("automate.title")} desc={t("automate.desc")} />
      <div className="px-4 sm:px-8 pt-2 pb-4 flex flex-col sm:flex-row sm:items-end gap-3 sm:gap-4">
        <div className="w-full sm:w-72">
          <label className="text-[12px] font-medium block mb-1" style={{ color: MUTED }}>{t("automate.product")}</label>
          <select className="rounded-lg px-3 py-2 text-sm outline-none w-full" style={{ border: `1px solid ${BORDER}`, background: "white" }} value={selectedId === null ? "new" : selectedId} onChange={(e) => selectProduct(e.target.value === "new" ? null : Number(e.target.value))}>
            <option value="new">{t("automate.newProduct")}</option>
            {products.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
          </select>
        </div>
        <div className="w-full sm:w-52">
          <label className="text-[12px] font-medium block mb-1" style={{ color: MUTED }}>{t("automate.language")}</label>
          <select className="rounded-lg px-3 py-2 text-sm outline-none w-full" style={{ border: `1px solid ${BORDER}`, background: "white" }} value={contentLang} onChange={(e) => setContentLang(e.target.value)}>
            {CONTENT_LANGUAGES.map((l) => <option key={l.id} value={l.id}>{l.label}</option>)}
          </select>
        </div>
      </div>
      <div className="px-4 sm:px-8 pb-6 grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div className="rounded-xl p-5 space-y-3" style={{ background: "white", border: `1px solid ${BORDER}` }}>
          <ImageUpload value={form.image} onChange={(v) => setForm({ ...form, image: v })} />
          <Field label={t("automate.name")} value={form.name} onChange={(v) => setForm({ ...form, name: v })} placeholder={t("automate.namePh")} />
          <Field label={t("automate.category")} value={form.category} onChange={(v) => setForm({ ...form, category: v })} placeholder={t("automate.categoryPh")} />
          <Field label={t("automate.features")} value={form.features} onChange={(v) => setForm({ ...form, features: v })} placeholder={t("automate.featuresPh")} textarea />
          <Field label={t("automate.price")} value={form.price} onChange={(v) => setForm({ ...form, price: v })} placeholder={t("automate.pricePh")} />
          <button onClick={generate} disabled={!canGenerate || loading} className="mt-2 w-full flex items-center justify-center gap-2 py-2.5 rounded-lg text-sm font-semibold text-white" style={{ background: canGenerate ? CORAL : "#D8B5A6", opacity: loading ? 0.7 : 1 }}>
            {loading ? <Loader2 size={16} className="animate-spin" /> : <Wand2 size={16} />}
            {loading ? t("automate.generating") : t("automate.generate")}
          </button>
          {error && <p className="text-xs" style={{ color: CORAL }}>{error}</p>}
        </div>
        <div className="space-y-3">
          {!result && !loading && (
            <div className="rounded-xl p-8 text-center text-sm" style={{ background: "white", border: `1px dashed ${BORDER}`, color: "#8A8F9C" }}>{t("automate.empty")}</div>
          )}
          {result && PLATFORMS.map((p) => {
            const isPublished = livePublished?.[p.id];
            return (
              <div key={p.id} className="rounded-xl p-4" style={{ background: "white", border: `1px solid ${BORDER}` }}>
                <div className="flex items-center justify-between mb-2">
                  <div className="flex items-center gap-2"><span className="w-2 h-2 rounded-full" style={{ background: p.color }} /><span className="text-xs font-bold" style={{ color: NAVY }}>{p.name}</span></div>
                  {isPublished ? (
                    <span className="flex items-center gap-1 text-[11px] font-semibold" style={{ color: GREEN }}><Check size={12} /> {t("automate.published")}</span>
                  ) : (
                    <button onClick={() => publish(p.id)} disabled={publishing === p.id} className="flex items-center gap-1 text-[10.5px] font-semibold px-2.5 py-1 rounded-md text-white" style={{ background: NAVY, opacity: publishing === p.id ? 0.6 : 1 }}>
                      {publishing === p.id ? <Loader2 size={11} className="animate-spin" /> : <UploadCloud size={11} />}
                      {publishing === p.id ? t("automate.publishing") : t("automate.publish")}
                    </button>
                  )}
                </div>
                <p className="text-[13px] leading-relaxed" style={{ color: INK }}>{result[p.id]}</p>
              </div>
            );
          })}
          {result && <p className="text-[11px]" style={{ color: "#9AA6C0" }}>{t("automate.publishNote")}</p>}
        </div>
      </div>
    </div>
  );
}

function Field({ label, value, onChange, placeholder, textarea }) {
  return (
    <div>
      <label className="text-[12px] font-medium block mb-1" style={{ color: MUTED }}>{label}</label>
      {textarea ? (
        <textarea className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={{ border: `1px solid ${BORDER}`, background: CREAM }} rows={2} value={value} placeholder={placeholder} onChange={(e) => onChange(e.target.value)} />
      ) : (
        <input className="w-full rounded-lg px-3 py-2 text-sm outline-none" style={{ border: `1px solid ${BORDER}`, background: CREAM }} value={value} placeholder={placeholder} onChange={(e) => onChange(e.target.value)} />
      )}
    </div>
  );
}

function Advise({ products, orders }) {
  const { t, lang } = useLang();
  const [loading, setLoading] = useState(false);
  const [priorities, setPriorities] = useState(null);
  const [error, setError] = useState("");

  async function generate() {
    setLoading(true); setError(""); setPriorities(null);
    const languageLabel = UI_LANGUAGES.find((l) => l.id === lang)?.label || "English";
    const backlog = PLATFORMS.map((p) => `${p.name}: ${orders.filter((o) => o.platform === p.id && o.status !== "delivered").length}`).join(", ");
    const returnsSummary = products.map((p) => {
      const lines = PLATFORMS.map((pl) => {
        const r = p.returns?.[pl.id];
        const top = topReturnReason(r?.reasons);
        return `${pl.name}: ${r?.total || 0} returns${top ? ` (top reason: ${top.key})` : ""}`;
      }).join("; ");
      return `- ${p.name}: ${lines}`;
    }).join("\n");
    const priceIssues = products.filter((p) => priceSpread(p.platformPrices) > 3)
      .map((p) => `- ${p.name}: price varies by RM ${priceSpread(p.platformPrices).toFixed(2)} across platforms`).join("\n") || "None";

    const prompt = `You are OneNiaga's AI business advisor for a Malaysian multi-platform seller. Based on this simulated data, produce today's prioritised action list.
Write your entire response (titles and reasons) in ${languageLabel}, regardless of the language this data is written in.

Inventory (product, units left, average units sold per day):
${products.map((p) => `- ${p.name}: ${p.stock} units left, selling ~${p.dailySales}/day`).join("\n")}

Orders not yet delivered, by platform: ${backlog}

Last 7 days revenue by platform:
${JSON.stringify(WEEKLY_SALES)}

Returns and return reasons per product, per platform (last 7 days):
${returnsSummary}

Products with inconsistent pricing across platforms:
${priceIssues}

Generate 3-5 prioritised recommendations. Cover restocking, platform focus, AND at least one recommendation about returns or pricing if the data above shows a real issue.

Respond with ONLY plain lines in exactly this format — one recommendation per line, nothing else before or after, no markdown, no numbering, no bullet points:
level|title|reason

Where level is exactly one of: high, medium, low. title is under 8 words (in ${languageLabel}). reason is one sentence grounded in the numbers above (in ${languageLabel}). Do not use any "|" character inside title or reason. Do not wrap anything in quotes.
Example line: high|Restock Product A today|Only 2 days of stock left at the current sales pace.`;
    try {
      const text = await callClaude(prompt);
      setPriorities(parsePipedLines(text));
    }
    catch (e) { setError(`${t("advise.error")} (${e.message})`); }
    finally { setLoading(false); }
  }

  const levelColor = { high: CORAL, medium: AMBER, low: GREEN };
  const levelBg = { high: "#FBE4DB", medium: "#F6EBD8", low: "#E3EFE9" };

  return (
    <div>
      <PageHeader eyebrow={t("nav.advise")} title={t("advise.title")} desc={t("advise.desc")} />
      <div className="px-4 sm:px-8 py-6">
        <div className="rounded-2xl p-6" style={{ background: NAVY, boxShadow: "0 8px 30px rgba(27,42,74,0.25)" }}>
          <div className="flex items-center justify-between mb-5">
            <div className="flex items-center gap-2 text-white font-bold"><Sparkles size={18} style={{ color: CORAL }} /> {t("advise.cardTitle")}</div>
            <button onClick={generate} disabled={loading} className="flex items-center gap-1.5 text-xs font-semibold px-3.5 py-2 rounded-lg text-white" style={{ background: CORAL, opacity: loading ? 0.7 : 1 }}>
              {loading ? <Loader2 size={14} className="animate-spin" /> : <ArrowRight size={14} />}
              {loading ? t("advise.thinking") : t("advise.generate")}
            </button>
          </div>
          {error && <p className="text-xs mb-3" style={{ color: "#F3A98D" }}>{error}</p>}
          {!priorities && !loading && <p className="text-sm" style={{ color: "#9AA6C0" }}>{t("advise.empty")}</p>}
          <AnimatedList className="space-y-2.5" staggerMs={80}>
            {priorities && priorities.map((p, i) => (
              <div key={i} className="rounded-xl p-4 flex items-start gap-3" style={{ background: NAVY_LIGHT }}>
                <span className="text-[10px] font-bold px-2 py-1 rounded-full shrink-0 mt-0.5" style={{ background: levelBg[p.level] || levelBg.low, color: levelColor[p.level] || levelColor.low }}>{(p.level || "low").toUpperCase()}</span>
                <div><div className="text-white font-semibold text-sm">{p.title}</div><div className="text-[13px] mt-0.5" style={{ color: "#B7C0D8" }}>{p.reason}</div></div>
              </div>
            ))}
          </AnimatedList>
        </div>
        <div className="mt-5 rounded-xl p-4 text-[12.5px]" style={{ background: "white", border: `1px solid ${BORDER}`, color: MUTED }}>{t("advise.note")}</div>
      </div>
    </div>
  );
}

function MessagesPage({ messages, setMessages, products }) {
  const { t } = useLang();
  const [loadingId, setLoadingId] = useState(null);
  const [errorId, setErrorId] = useState(null);
  const [errorMsg, setErrorMsg] = useState("");

  async function draftReply(m) {
    setLoadingId(m.id); setErrorId(null);
    const matchedProduct = products.find((p) => p.name === m.product);
    const platformListingName = matchedProduct?.descriptions?.[m.platform]
      ? `On ${platformName(m.platform)}, this product's own listing describes it as follows — match its naming/tone when you refer to the product: "${matchedProduct.descriptions[m.platform]}"`
      : `No platform-specific listing text is available yet — refer to the product simply as "${m.product}".`;
    const prompt = `You are OneNiaga's AI customer service assistant for a Malaysian multi-platform seller.
Platform: ${platformName(m.platform)}
Product (internal reference name): ${m.product}
${platformListingName}
Customer message: "${m.message}"

Write a short, friendly, on-brand reply (2-3 sentences) a small business owner could send as-is.
IMPORTANT: Detect the language the customer used in their message above, and reply in that SAME language — do not default to English unless the customer wrote in English. Match the customer's tone.
When referring to the product, use the naming style from the platform listing text above (if given) rather than a generic translated name, so it reads naturally to a customer already viewing that listing.
If they ask something you can't know for certain (like exact shipping time), reassure them and say the team will confirm shortly.
Respond with ONLY the reply text itself as plain text — no JSON, no quotation marks around it, no preamble, no labels.`;
    try {
      const text = await callClaude(prompt);
      const reply = text.trim();
      setMessages((prev) => prev.map((mm) => mm.id === m.id ? { ...mm, draft: reply } : mm));
    } catch (e) {
      setErrorId(m.id);
      setErrorMsg(e.message);
    } finally {
      setLoadingId(null);
    }
  }

  function updateDraft(id, text) {
    setMessages((prev) => prev.map((mm) => mm.id === id ? { ...mm, draft: text } : mm));
  }

  function send(m) {
    setMessages((prev) => prev.map((mm) => mm.id === m.id ? { ...mm, replied: true } : mm));
  }

  return (
    <div>
      <PageHeader eyebrow={t("nav.messages")} title={t("messages.title")} desc={t("messages.desc")} />
      <div className="px-4 sm:px-8 pb-8 space-y-3">
        {messages.map((m) => {
          const p = PLATFORMS.find((pl) => pl.id === m.platform);
          return (
            <div key={m.id} className="rounded-xl p-4" style={{ background: "white", border: `1px solid ${BORDER}` }}>
              <div className="flex items-center justify-between mb-1.5">
                <div className="flex items-center gap-2 text-[11.5px]" style={{ color: MUTED }}>
                  <span className="w-1.5 h-1.5 rounded-full" style={{ background: p.color }} />
                  <span className="font-semibold" style={{ color: NAVY }}>{m.customer}</span>
                  <span>· {p.name}</span>
                  <span>· {m.product}</span>
                </div>
                {m.replied && <span className="flex items-center gap-1 text-[10.5px] font-semibold" style={{ color: GREEN }}><Check size={12} /> {t("messages.replied")}</span>}
              </div>
              <p className="text-[13px] mb-3" style={{ color: INK }}>{m.message}</p>

              {m.draft && !m.replied && (
                <div className="rounded-lg p-3 mb-2" style={{ background: CREAM }}>
                  <div className="flex items-center justify-between mb-1">
                    <span className="text-[10.5px] font-semibold" style={{ color: MUTED }}>{t("messages.editHint")}</span>
                    <span className="text-[10px]" style={{ color: "#9A927E" }}>{m.draft.length} chars</span>
                  </div>
                  <textarea className="w-full text-[12.5px] rounded-md px-2.5 py-2 outline-none resize-none" style={{ background: "white", border: `1px solid ${BORDER}`, color: INK }} rows={3} value={m.draft} onChange={(e) => updateDraft(m.id, e.target.value)} />
                </div>
              )}
              {m.draft && m.replied && (
                <div className="rounded-lg p-3 mb-2" style={{ background: CREAM }}>
                  <div className="text-[10.5px] font-semibold mb-1" style={{ color: MUTED }}>{t("messages.sentLabel")}</div>
                  <p className="text-[12.5px]" style={{ color: INK }}>{m.draft}</p>
                </div>
              )}
              {errorId === m.id && <p className="text-[11px] mb-2" style={{ color: CORAL }}>{t("messages.error")} ({errorMsg})</p>}

              {!m.replied && (
                <div className="flex items-center gap-2">
                  <button onClick={() => draftReply(m)} disabled={loadingId === m.id} className="flex items-center gap-1.5 text-[11.5px] font-semibold px-3 py-1.5 rounded-lg text-white" style={{ background: NAVY, opacity: loadingId === m.id ? 0.6 : 1 }}>
                    {loadingId === m.id ? <Loader2 size={12} className="animate-spin" /> : <Wand2 size={12} />}
                    {loadingId === m.id ? t("messages.drafting") : m.draft ? t("messages.regenDraft") : t("messages.draft")}
                  </button>
                  {m.draft && (
                    <button onClick={() => send(m)} disabled={!m.draft.trim()} className="flex items-center gap-1.5 text-[11.5px] font-semibold px-3 py-1.5 rounded-lg text-white" style={{ background: m.draft.trim() ? CORAL : "#D8B5A6" }}>
                      <Send size={12} /> {t("messages.send")}
                    </button>
                  )}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ================= SUBSCRIPTION =================
function SubscriptionPage({ subscribed, plan, setSubscribed, setPlan }) {
  const { t } = useLang();
  function subscribe(id) { setPlan(id); setSubscribed(true); }
  function cancel() { setSubscribed(false); setPlan(null); }
  return (
    <div>
      <PageHeader eyebrow={t("nav.subscription")} title={subscribed ? t("subscription.titleManage") : t("subscription.title")} desc={subscribed ? t("subscription.descManage") : t("subscription.desc")} />
      <div className="px-4 sm:px-8 pb-8 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        {PLAN_DEFS.map((pl) => {
          const active = plan === pl.id;
          return (
            <div key={pl.id} className="rounded-xl p-5 flex flex-col" style={{ background: active ? NAVY : "white", border: pl.highlight && !active ? `1.5px solid ${CORAL}` : `1px solid ${BORDER}` }}>
              {pl.highlight && !active && <span className="text-[10px] font-bold self-start px-2 py-0.5 rounded-full mb-2" style={{ background: "#FBE4DB", color: CORAL }}>{t("subscription.popular")}</span>}
              <div className="font-bold text-sm" style={{ color: active ? "white" : NAVY }}>{pl.name}</div>
              <div className="mt-1"><span className="text-xl font-bold" style={{ color: active ? "white" : NAVY }}>{pl.price}</span><span className="text-[11px]" style={{ color: active ? "#9AA6C0" : MUTED }}>/mo</span></div>
              <ul className="mt-3 space-y-1.5 flex-1">
                {pl.features.map((f, i) => <li key={i} className="flex items-start gap-1.5 text-[11.5px]" style={{ color: active ? "#E4E8F2" : INK }}><Check size={12} className="mt-0.5 shrink-0" style={{ color: active ? "#8FD9B6" : GREEN }} /> {f}</li>)}
              </ul>
              {active ? (
                <button onClick={cancel} className="mt-4 w-full py-2 rounded-lg text-[12.5px] font-semibold" style={{ background: "#2E4270", color: "white" }}>{t("subscription.cancel")}</button>
              ) : (
                <button onClick={() => subscribe(pl.id)} className="mt-4 w-full py-2 rounded-lg text-[12.5px] font-semibold text-white" style={{ background: CORAL }}>{subscribed ? t("subscription.switch") : t("subscription.subscribe")}</button>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ================= SETTINGS =================
function SettingsPage({ user, linked, setLinked, subscribed, plan, setTab, onSignOut }) {
  const { t } = useLang();
  const [connecting, setConnecting] = useState(null);
  function toggle(id) {
    if (linked[id]) { setLinked((prev) => ({ ...prev, [id]: false })); return; }
    setConnecting(id);
    setTimeout(() => { setLinked((prev) => ({ ...prev, [id]: true })); setConnecting(null); }, 800);
  }
  return (
    <div>
      <PageHeader eyebrow={t("nav.settings")} title={t("settings.title")} />
      <div className="px-4 sm:px-8 pb-8 space-y-5 max-w-xl">
        <div className="rounded-xl p-5" style={{ background: "white", border: `1px solid ${BORDER}` }}>
          <div className="text-[12px] font-semibold mb-1" style={{ color: MUTED }}>{t("settings.signedInAs")}</div>
          <div className="text-sm font-medium" style={{ color: NAVY }}>{user?.email}</div>
          <button onClick={onSignOut} className="mt-3 flex items-center gap-1.5 text-[12.5px] font-semibold px-3 py-1.5 rounded-lg" style={{ background: "#FBE4DB", color: CORAL }}><LogOut size={13} /> {t("settings.signOut")}</button>
        </div>
        <div className="rounded-xl p-5" style={{ background: "white", border: `1px solid ${BORDER}` }}>
          <div className="text-[12px] font-semibold mb-3" style={{ color: MUTED }}>{t("settings.linked")}</div>
          <div className="space-y-2">
            {PLATFORMS.map((p) => (
              <div key={p.id} className="flex items-center justify-between rounded-lg px-3.5 py-2.5" style={{ border: `1px solid ${BORDER}` }}>
                <div className="flex items-center gap-2.5"><span className="w-2 h-2 rounded-full" style={{ background: p.color }} /><span className="text-sm" style={{ color: INK }}>{p.name}</span></div>
                <button onClick={() => toggle(p.id)} disabled={connecting === p.id} className="text-[11.5px] font-semibold px-3 py-1 rounded-lg" style={{ background: linked[p.id] ? "#E3EFE9" : NAVY, color: linked[p.id] ? GREEN : "white" }}>
                  {connecting === p.id ? t("connect.connecting") : linked[p.id] ? t("settings.disconnect") : t("connect.connect")}
                </button>
              </div>
            ))}
          </div>
        </div>
        <div className="rounded-xl p-5" style={{ background: "white", border: `1px solid ${BORDER}` }}>
          <div className="text-[12px] font-semibold mb-1" style={{ color: MUTED }}>{t("settings.subscription")}</div>
          <div className="text-sm font-medium" style={{ color: NAVY }}>{subscribed ? `${PLAN_DEFS.find((p) => p.id === plan)?.name}` : t("settings.notSubscribed")}</div>
          <button onClick={() => setTab("subscription")} className="mt-3 flex items-center gap-1.5 text-[12.5px] font-semibold px-3 py-1.5 rounded-lg text-white" style={{ background: NAVY }}><CreditCard size={13} /> {t("settings.manage")}</button>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>

<script>
  function showBootError(title, detail) {
    var box = document.getElementById("boot-error");
    var fallback = document.getElementById("boot-fallback");
    if (fallback) fallback.style.display = "none";
    box.style.display = "block";
    box.textContent = "\u26A0 " + title + "\n\n" + (detail || "");
  }
  window.addEventListener("error", function (e) {
    showBootError("A script failed to load or run", (e.message || "") + (e.filename ? ("\nFile: " + e.filename + ":" + e.lineno) : ""));
  });
  window.addEventListener("unhandledrejection", function (e) {
    showBootError("A module failed to load (unhandled promise rejection)", String(e.reason && (e.reason.stack || e.reason.message || e.reason)));
  });
  setTimeout(function () {
    var fallback = document.getElementById("boot-fallback");
    if (fallback && fallback.offsetParent !== null) {
      showBootError(
        "Still loading after 25 seconds",
        "Things to check:\n" +
        "1. This needs an active internet connection the first time it opens (React, icons, and charts load from a CDN).\n" +
        "2. Open DevTools (F12, or Cmd+Opt+I on Mac) \u2192 Console tab, and look for a red error mentioning esm.sh, jsdelivr, unpkg, or cdnjs.\n" +
        "3. An ad blocker or strict privacy/network setting can block these CDNs \u2014 try disabling it for this page, or a different network/browser.\n" +
        "4. If you're viewing this inside a sandboxed preview rather than a real browser tab, download the file and open it directly instead."
      );
    }
  }, 25000);

  function checkUrl(url, label, timeoutMs) {
    var timeoutPromise = new Promise(function (resolve) {
      setTimeout(function () { resolve({ label: label, ok: false, detail: "timed out after " + timeoutMs + "ms" }); }, timeoutMs);
    });
    var fetchPromise = fetch(url, { mode: "cors" }).then(function (res) {
      return { label: label, ok: res.ok, detail: "HTTP " + res.status };
    }).catch(function (err) {
      return { label: label, ok: false, detail: String(err && err.message || err) };
    });
    return Promise.race([fetchPromise, timeoutPromise]);
  }

  var DEP_URLS = [
    ["React", "https://esm.sh/react@18.3.1"],
    ["ReactDOM", "https://esm.sh/react-dom@18.3.1/client"],
    ["lucide-react (icons)", "https://esm.sh/lucide-react@0.383.0?external=react"],
    ["recharts (charts)", "https://esm.sh/recharts@2.12.7?external=react,react-dom"]
  ];

  function updateBootStatus(text) {
    var fallback = document.getElementById("boot-fallback");
    if (fallback) fallback.textContent = text;
  }

  async function preflightCheck() {
    updateBootStatus("Checking CDN connections…");
    return Promise.all(DEP_URLS.map(function (d) { return checkUrl(d[1], d[0], 9000); }));
  }

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = src;
      s.onload = resolve;
      s.onerror = function () { reject(new Error("failed: " + src)); };
      document.head.appendChild(s);
    });
  }
  var BABEL_SOURCES = [
    "https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js",
    "https://unpkg.com/@babel/standalone/babel.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"
  ];
  async function loadBabel() {
    for (var i = 0; i < BABEL_SOURCES.length; i++) {
      try {
        await loadScript(BABEL_SOURCES[i]);
        if (window.Babel) return true;
      } catch (e) { /* try next CDN */ }
    }
    return false;
  }

  loadBabel().then(async function (ok) {
    if (!ok) {
      showBootError(
        "Could not load Babel Standalone from any CDN",
        "Tried jsdelivr, unpkg, and cdnjs \u2014 all failed. This network is likely blocking script CDNs entirely (common on some school/office networks). Try a mobile hotspot or a different network, or a different browser/device."
      );
      return;
    }

    var results = await preflightCheck();
    var failed = results.filter(function (r) { return !r.ok; });
    if (failed.length > 0) {
      var lines = results.map(function (r) { return (r.ok ? "\u2713 " : "\u2717 ") + r.label + ": " + (r.ok ? "reachable" : r.detail); });
      showBootError(
        "Could not reach " + failed.length + " of " + results.length + " required CDN dependencies",
        lines.join("\n") + "\n\nThis points to a specific network restriction on esm.sh rather than a bug in the app itself. Try a different network (e.g. mobile hotspot) or ask your network admin whether esm.sh is blocked."
      );
      return;
    }

    updateBootStatus("Starting app…");
    try {
      var source = document.getElementById("app-source").textContent;
      var transformed = Babel.transform(source, { presets: [["react", { runtime: "classic" }]], sourceType: "module" }).code;
      // Inject as a real <script type="module"> element rather than a blob: URL —
      // some browsers/extensions block blob: as a script source under strict CSP,
      // but a literal type="module" tag with native import statements is always
      // allowed and resolves the esm.sh imports directly.
      var moduleScript = document.createElement("script");
      moduleScript.type = "module";
      moduleScript.textContent = transformed;
      document.body.appendChild(moduleScript);
    } catch (err) {
      showBootError("Babel failed to transform the app source", String(err && (err.stack || err.message || err)));
    }
  });
</script>
